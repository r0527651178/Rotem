<section class="stats" [class.stats--on]="started()" aria-label="במספרים">
  <ul class="stats__list">
    @for (item of items(); track item.label; let i = $index) {
      <li class="stat" [style.--i]="i">
        <span class="stat__value" [attr.aria-label]="final(item.value)">
          <span class="stat__ghost" aria-hidden="true">{{ final(item.value) }}</span>
          <span class="stat__count" aria-hidden="true">{{ display(item.value) }}</span>
        </span>
        <span class="stat__label">{{ item.label }}</span>
      </li>
    }
  </ul>
</section>
